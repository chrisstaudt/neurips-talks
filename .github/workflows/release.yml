name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build universal release
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
        run: ./build_app.sh --download-tools --universal --archive
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/NeurIPS-Talks-macOS-universal.zip"
          "dist/NeurIPS-Talks-macOS-universal.zip.sha256"
          --verify-tag --generate-notes
          --title "NeurIPS Talks ${GITHUB_REF_NAME}"
      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: NeurIPS-Talks-macOS-universal
          path: |
            dist/NeurIPS-Talks-macOS-universal.zip
            dist/NeurIPS-Talks-macOS-universal.zip.sha256
